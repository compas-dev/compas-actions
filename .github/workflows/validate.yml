name: validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actions:
    name: Validate actions and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          persona: regular
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Compile Python helpers
        run: |
          python -m py_compile release-pr/prepare_changelog.py
          python -m py_compile release-check/check_release.py

      - name: Test release helpers
        run: python -m unittest discover -s tests
      - name: Reject removed implementations
        shell: bash
        run: |
          if find . -not -path './.git/*' -type f \( -iname '*ironpython*' -o -iname '*sphinx*' -o -iname '*docversions*' \) | grep -q .; then
            echo "::error::Legacy implementation found"
            exit 1
          fi

  componentizer:
    name: Test standalone componentizer integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: compas-dev/ghpython_componentizer
          ref: main
          path: componentizer-fixture
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: ./ghpython-components
        with:
          source: componentizer-fixture/examples/cpy
          target: ${{ runner.temp }}/ghuser
          componentizer-ref: main
      - name: Verify generated components
        shell: pwsh
        run: |
          $components = Get-ChildItem "${{ runner.temp }}/ghuser" -Filter *.ghuser
          if ($components.Count -eq 0) {
            Write-Error "The componentizer did not generate any .ghuser files."
            exit 1
          }
