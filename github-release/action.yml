name: Create GitHub release
description: Create a GitHub release from a version tag and optional artifacts

inputs:
  github-token:
    description: "GitHub token with contents: write"
    required: true
  tag-name:
    description: Tag to create; defaults to the current tag ref
    default: ""
  target:
    description: Commit or branch targeted when creating a new tag
    default: ""
  release-name-prefix:
    description: Prefix before the version, for example COMPAS
    default: ""
  changelog-path:
    description: Path to the changelog
    default: CHANGELOG.md
  artifacts:
    description: Comma-separated artifact globs to attach
    default: ""
  distribution-artifact-name:
    description: Workflow artifact containing distributions; leave empty for none
    default: python-package-distributions
  release-assets-artifact-name:
    description: Workflow artifact containing additional release assets; leave empty for none
    default: ""
  release-assets-artifact-pattern:
    description: >-
      Glob matching several artifacts of release assets, for a release whose assets are
      produced by more than one job. Takes precedence over release-assets-artifact-name.
    default: ""
  generate-release-notes:
    description: Ask GitHub to generate release notes instead of reading the changelog
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve release tag
      id: ref
      shell: bash
      env:
        EXPLICIT_TAG: ${{ inputs.tag-name }}
      run: |
        tag="$EXPLICIT_TAG"
        if [[ -z "$tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        fi
        if [[ -z "$tag" ]]; then
          echo "::error::GitHub releases must be created from a tag, not '$GITHUB_REF'"
          exit 1
        fi
        if [[ "$tag" != v* ]]; then
          echo "::error::Release tags must start with v: '$tag'"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download Python distributions
      if: inputs.distribution-artifact-name != ''
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.distribution-artifact-name }}
        path: release-assets

    - name: Download additional release assets
      if: inputs.release-assets-artifact-name != '' && inputs.release-assets-artifact-pattern == ''
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.release-assets-artifact-name }}
        path: release-assets

    - name: Download additional release assets from several artifacts
      if: inputs.release-assets-artifact-pattern != ''
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: ${{ inputs.release-assets-artifact-pattern }}
        merge-multiple: true
        path: release-assets

    - name: Read changelog entry
      if: inputs.generate-release-notes != 'true'
      id: changelog
      uses: mindsers/changelog-reader-action@v2.4.0
      with:
        version: ${{ steps.ref.outputs.version }}
        path: ${{ inputs.changelog-path }}

    - name: Assemble release name
      id: release
      shell: bash
      env:
        PREFIX: ${{ inputs.release-name-prefix }}
        TAG: ${{ steps.ref.outputs.tag }}
      run: |
        version="${TAG#v}"
        if [[ -n "$PREFIX" ]]; then
          name="$PREFIX $version"
        else
          name="$TAG"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Create release
      shell: bash
      env:
        ARTIFACT_PATTERNS: ${{ inputs.artifacts }}
        GENERATE_RELEASE_NOTES: ${{ inputs.generate-release-notes }}
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_NAME: ${{ steps.release.outputs.name }}
        RELEASE_NOTES: ${{ steps.changelog.outputs.changes }}
        TAG: ${{ steps.ref.outputs.tag }}
        TARGET: ${{ inputs.target }}
      run: |
        args=(release create "$TAG" --title "$RELEASE_NAME")
        if [[ -n "$TARGET" ]]; then
          args+=(--target "$TARGET")
        fi
        if [[ "$GENERATE_RELEASE_NOTES" == "true" ]]; then
          args+=(--generate-notes)
        else
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          args+=(--notes-file "$notes_file")
        fi

        if [[ -d release-assets ]]; then
          while IFS= read -r -d '' asset; do
            args+=("$asset")
          done < <(find release-assets -type f -print0)
        fi

        if [[ -n "$ARTIFACT_PATTERNS" ]]; then
          IFS=',' read -r -a patterns <<< "$ARTIFACT_PATTERNS"
          for pattern in "${patterns[@]}"; do
            found=false
            while IFS= read -r asset; do
              found=true
              args+=("$asset")
            done < <(compgen -G "$pattern" || true)
            if [[ "$found" == "false" ]]; then
              echo "::error::No release assets match: $pattern"
              exit 1
            fi
          done
        fi
        gh "${args[@]}"
