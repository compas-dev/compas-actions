name: Build and verify Python distributions
description: Build once, validate metadata, install the wheel, and smoke-test imports

inputs:
  build:
    description: Build distributions before verification
    default: "true"
  sdist:
    description: Build a source distribution
    default: "true"
  wheel:
    description: Build a wheel
    default: "true"
  output-directory:
    description: Directory containing built distributions
    default: dist
  project-directory:
    description: Project directory to build
    default: .
  import-modules:
    description: Comma-separated modules imported from each installed wheel
    default: ""
  skip-install:
    description: Skip fresh-environment wheel installation
    default: "false"

outputs:
  distributions:
    description: Newline-separated verified distribution paths
    value: ${{ steps.verify.outputs.distributions }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
        BUILD_SDIST: ${{ inputs.sdist }}
        BUILD_WHEEL: ${{ inputs.wheel }}
        SKIP_INSTALL: ${{ inputs.skip-install }}
      run: |
        for value in "$BUILD" "$BUILD_SDIST" "$BUILD_WHEEL" "$SKIP_INSTALL"; do
          case "$value" in true|false) ;; *) echo "::error::boolean inputs must be true or false"; exit 1 ;; esac
        done
        if [[ "$BUILD" == "true" && "$BUILD_SDIST" != "true" && "$BUILD_WHEEL" != "true" ]]; then
          echo "::error::At least one of sdist or wheel must be true when build is true"
          exit 1
        fi
    - name: Install packaging tools
      shell: bash
      run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
    - name: Build distributions
      if: inputs.build == 'true'
      shell: bash
      env:
        BUILD_SDIST: ${{ inputs.sdist }}
        BUILD_WHEEL: ${{ inputs.wheel }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
      run: |
        args=(--outdir "$OUTPUT_DIRECTORY")
        [[ "$BUILD_SDIST" == "true" ]] && args+=(--sdist)
        [[ "$BUILD_WHEEL" == "true" ]] && args+=(--wheel)
        python -m build "$PROJECT_DIRECTORY" "${args[@]}"
    - name: Verify distributions
      id: verify
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        IMPORT_MODULES: ${{ inputs.import-modules }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        SKIP_INSTALL: ${{ inputs.skip-install }}
      run: |
        args=("$ACTION_PATH/verify_distributions.py" "$OUTPUT_DIRECTORY")
        [[ "$SKIP_INSTALL" == "true" ]] && args+=(--skip-install)
        IFS=',' read -r -a modules <<< "$IMPORT_MODULES"
        for module in "${modules[@]}"; do
          module="${module#${module%%[![:space:]]*}}"
          module="${module%${module##*[![:space:]]}}"
          [[ -n "$module" ]] && args+=(--import-module "$module")
        done
        python "${args[@]}"
