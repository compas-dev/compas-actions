name: Prepare Python release
description: Build and upload Python distributions plus optional release assets

inputs:
  python-version:
    description: Python version used to build distributions
    default: "3.12"
  management-tool:
    description: Dependency manager used for pre-build tasks (uv or conda)
    default: uv
  extras:
    description: Extras needed by pre-build tasks
    default: dev
  conda-environment:
    description: Name of the Conda environment
    default: compas
  environment-file:
    description: Explicit Conda environment file; OS-specific files are detected when omitted
    default: ""
  run-prebuild:
    description: Run invoke pre-build before packaging
    default: "false"
  sdist:
    description: Build a source distribution
    default: "true"
  wheel:
    description: Build a wheel
    default: "true"
  release-assets:
    description: Optional multiline paths/globs for non-PyPI release assets
    default: ""
  distribution-artifact-name:
    description: Workflow artifact containing Python distributions
    default: python-package-distributions
  release-assets-artifact-name:
    description: Workflow artifact containing additional release assets
    default: github-release-assets

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-python@v7.0.0
      if: inputs.management-tool == 'uv'
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@v10.0.0
      if: inputs.management-tool == 'uv'

    - name: Validate management tool
      shell: bash
      env:
        MANAGEMENT_TOOL: ${{ inputs.management-tool }}
      run: |
        case "$MANAGEMENT_TOOL" in
          uv|conda) ;;
          *) echo "::error::management-tool must be uv or conda"; exit 1 ;;
        esac

    - name: Set up Conda
      if: inputs.management-tool == 'conda'
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        miniconda-version: latest
        channels: conda-forge
        activate-environment: ${{ inputs.conda-environment }}
        python-version: ${{ inputs.python-version }}

    - name: Select Conda environment file
      if: inputs.management-tool == 'conda'
      id: conda-file
      shell: bash -el {0}
      env:
        EXPLICIT_FILE: ${{ inputs.environment-file }}
      run: |
        if [[ -n "$EXPLICIT_FILE" ]]; then
          candidate="$EXPLICIT_FILE"
        elif [[ "$RUNNER_OS" == "Windows" && -f env_win.yml ]]; then
          candidate=env_win.yml
        elif [[ "$RUNNER_OS" == "macOS" && -f env_osx.yml ]]; then
          candidate=env_osx.yml
        elif [[ "$RUNNER_OS" == "Linux" && -f env_linux.yml ]]; then
          candidate=env_linux.yml
        else
          candidate=environment.yml
        fi

        if [[ ! -f "$candidate" ]]; then
          echo "::error::Conda environment file not found: $candidate"
          exit 1
        fi
        echo "path=$candidate" >> "$GITHUB_OUTPUT"

    - name: Install Conda environment
      if: inputs.management-tool == 'conda'
      shell: bash -el {0}
      env:
        CONDA_ENVIRONMENT: ${{ inputs.conda-environment }}
        ENVIRONMENT_FILE: ${{ steps.conda-file.outputs.path }}
      run: conda env update -f "$ENVIRONMENT_FILE" -n "$CONDA_ENVIRONMENT"

    - name: Install project for pre-build
      if: inputs.run-prebuild == 'true' && inputs.management-tool == 'uv'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        requirement="."
        [[ -n "$EXTRAS" ]] && requirement=".[$EXTRAS]"
        uv pip install --system -e "$requirement"

    - name: Run pre-build
      if: inputs.run-prebuild == 'true'
      shell: bash -el {0}
      run: invoke pre-build

    - name: Install packaging tools
      shell: bash -el {0}
      run: python -m pip install --upgrade build twine

    - name: Build and validate distributions
      shell: bash -el {0}
      env:
        BUILD_SDIST: ${{ inputs.sdist }}
        BUILD_WHEEL: ${{ inputs.wheel }}
      run: |
        args=()
        [[ "$BUILD_SDIST" == "true" ]] && args+=(--sdist)
        [[ "$BUILD_WHEEL" == "true" ]] && args+=(--wheel)
        if [[ ${#args[@]} -eq 0 ]]; then
          echo "::error::At least one of sdist or wheel must be true"
          exit 1
        fi
        python -m build "${args[@]}"
        python -m twine check dist/*

    - name: Upload Python distributions
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.distribution-artifact-name }}
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error

    - name: Upload additional release assets
      if: inputs.release-assets != ''
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.release-assets-artifact-name }}
        path: ${{ inputs.release-assets }}
        if-no-files-found: error
