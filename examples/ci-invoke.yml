name: build with existing Invoke tasks
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Replace the zero SHA with the reviewed compas-actions v2 commit.
      - uses: compas-dev/compas-actions/ci@0000000000000000000000000000000000000000
        with:
          python-version: ${{ matrix.python }}
          dependency-groups: dev
          extras: ""
          invoke-tasks: lint test
