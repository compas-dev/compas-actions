name: CGAL wheels
on: [pull_request]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Native prerequisites and the wheel build remain visible.
      - uses: pypa/cibuildwheel@0000000000000000000000000000000000000000 # Pin a reviewed commit.
        with:
          output-dir: wheelhouse
      # Replace the zero SHA with the reviewed compas-actions v2 commit.
      - uses: compas-dev/compas-actions/package@0000000000000000000000000000000000000000
        with:
          build: false
          output-directory: wheelhouse
          import-modules: compas_cgal
      # This matrix job runs on each target OS, so every compatible native wheel
      # is installed and import-smoked before artifacts are aggregated.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
