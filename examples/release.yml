name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-change:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: compas-dev/compas-actions/release-check@0000000000000000000000000000000000000000
        id: release
  prepare:
    needs: release-change
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@0000000000000000000000000000000000000000
        with:
          import-modules: your_package
  publish:
    needs: [release-change, prepare]
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/YOUR_PROJECT
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@0000000000000000000000000000000000000000 # Pin a reviewed commit.
  github-release:
    needs: [release-change, publish]
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@0000000000000000000000000000000000000000
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.release-change.outputs.tag }}
          target: ${{ github.sha }}
