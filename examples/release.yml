name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-change:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  test:
    needs: release-change
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}

  prepare:
    needs: [release-change, test]
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@v1
        with:
          run-prebuild: true
          release-assets: dist/proto/*.zip

  publish:
    needs: [release-change, prepare]
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/YOUR_PROJECT
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  release:
    needs: [release-change, publish]
    if: needs.release-change.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@v1
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.release-change.outputs.tag }}
          target: ${{ github.sha }}
          release-assets-artifact-name: github-release-assets
