name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: compas-dev/compas-actions/ci@main
        with:
          python-version: ${{ matrix.python }}

  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@main
        with:
          run-prebuild: true
          release-assets: dist/proto/*.zip

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/YOUR_PROJECT
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@main
        with:
          github-token: ${{ github.token }}
          release-assets-artifact-name: github-release-assets

