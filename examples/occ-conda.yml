name: OCC build
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Conda and PythonOCC provisioning remain explicit in the repository.
      - uses: conda-incubator/setup-miniconda@0000000000000000000000000000000000000000 # Pin a reviewed commit.
        with:
          python-version: ${{ matrix.python }}
          environment-file: environment.yml
          activate-environment: compas
      - run: python -m ruff check .
        shell: bash -el {0}
      - run: python -m pyright
        shell: bash -el {0}
      - run: python -m pytest
        shell: bash -el {0}
      - run: python -c "import OCC.Core.BRep"
        shell: bash -el {0}
