name: docs
on: [pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Replace the zero SHA with the reviewed compas-actions v2 commit.
      - uses: compas-dev/compas-actions/docs@0000000000000000000000000000000000000000
        with:
          dependency-groups: docs
          strict: true
