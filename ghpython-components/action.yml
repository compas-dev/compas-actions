name: Build CPython Grasshopper components
description: Create Rhino 8 CPython GHUser components from Python source code

inputs:
  source:
    description: Directory containing component source directories
    required: true
  target:
    description: Directory for generated GHUser files
    required: true
  prefix:
    description: Optional prefix added to each component name
    default: ""
  version:
    description: Optional package version substituted into component templates
    default: ""
  componentizer-ref:
    description: Immutable ghpython_componentizer Git commit to install
    default: 1212887a6033a5795e74ba8919cd31b37f08ca5c

runs:
  using: composite
  steps:
    - name: Require Windows
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne "Windows") {
          Write-Error "Grasshopper components can only be built on a Windows runner."
          exit 1
        }

    - name: Install ghpython_componentizer
      shell: pwsh
      env:
        COMPONENTIZER_REF: ${{ inputs.componentizer-ref }}
      run: |
        if ($env:COMPONENTIZER_REF -notmatch '^[0-9a-f]{40}$') {
          Write-Error "componentizer-ref must be a full Git commit SHA."
          exit 1
        }
        $requirement = "ghpython_componentizer @ git+https://github.com/compas-dev/ghpython_componentizer.git@$env:COMPONENTIZER_REF"
        python -m pip install --disable-pip-version-check $requirement

    - name: Build CPython components
      shell: pwsh
      env:
        COMPONENT_SOURCE: ${{ inputs.source }}
        COMPONENT_TARGET: ${{ inputs.target }}
        COMPONENT_PREFIX: ${{ inputs.prefix }}
        COMPONENT_VERSION: ${{ inputs.version }}
      run: |
        $params = @(
          $env:COMPONENT_SOURCE,
          $env:COMPONENT_TARGET
        )
        if ($env:COMPONENT_VERSION) {
          $params += @("--version", $env:COMPONENT_VERSION)
        }
        if ($env:COMPONENT_PREFIX) {
          $params += @("--prefix", $env:COMPONENT_PREFIX)
        }
        python -m ghpython_componentizer @params

branding:
  icon: box
  color: orange
